config settings 'settings'
	option log_stderr '0'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	# default to using nftables - change below to 'iptables' if still using iptables
	option fw_mode 'nftables'
	# Netmap cache placement. tailscaled derives the cache directory from the
	# state file's directory: <varRoot>/profile-data/<id>/netmap-cache with
	# varRoot=/etc/tailscale here, i.e. the flash overlay (ipn/ipnlocal/diskcache.go).
	#   ram   (default) symlink it onto /tmp -- no flash writes; the cache is
	#         disposable and only survives a tailscaled respawn, not a reboot
	#   off   same tmpfs symlink (the home-DERP write path is not gated by the
	#         env knob in 1.104.1) plus TS_USE_CACHED_NETMAP=false
	#   flash upstream behaviour, /etc/tailscale/profile-data: rewrites on every
	#         netmap and home-DERP change; opt-in if you want to survive a
	#         reboot with the control plane unreachable
	option netmap_cache 'ram'
	# gomemlimit (tailscaled GOMEMLIMIT heap ceiling) is intentionally NOT
	# set here: /etc/init.d/tailscale falls back to 90MiB. RAM-tight
	# profiles pin 40MiB through the tailscale-lowmem package's
	# uci-defaults (selected by configs/core_lite.config in the builder).