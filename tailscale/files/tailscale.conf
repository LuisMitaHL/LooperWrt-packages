config settings 'settings'
	option log_stderr '0'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	# default to using nftables - change below to 'iptables' if still using iptables
	option fw_mode 'nftables'
	# gomemlimit (tailscaled GOMEMLIMIT heap ceiling) is intentionally NOT
	# set here: /etc/init.d/tailscale falls back to 90MiB. RAM-tight
	# profiles pin 40MiB through the tailscale-lowmem package's
	# uci-defaults (selected by configs/core_lite.config in the builder).